{% extends "base.html" %}
{% block body %}
<div class="colab-app">
  <div class="colab-header">
    {% block header_colaborador %}{% endblock %}
  </div>

  <div class="colab-contenido">
    {% if messages %}
      <div class="mensajes">
        {% for m in messages %}
          <div class="mensaje {{ m.tags }}">{{ m }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block contenido_colaborador %}{% endblock %}
  </div>

  <nav class="colab-nav-inferior">
    <a href="{% url 'colaborador_inicio' %}" class="{% block nav_inicio %}{% endblock %}">
      <span class="icono">🏠</span>Inicio
    </a>
    <a href="{% url 'colaborador_horario' %}" class="{% block nav_horario %}{% endblock %}">
      <span class="icono">🗓️</span>Horario
    </a>
    <a href="{% url 'colaborador_seccion_simple' 'asistencias' %}" class="{% block nav_asistencias %}{% endblock %}">
      <span class="icono">✅</span>Asist.
    </a>
    <a href="{% url 'colaborador_seccion_simple' 'incidencias' %}" class="{% block nav_incidencias %}{% endblock %}">
      <span class="icono">⚠️</span>Incid.
    </a>
    <a href="{% url 'colaborador_perfil' %}" class="{% block nav_perfil %}{% endblock %}">
      <span class="icono">🙍</span>Perfil
    </a>
  </nav>
</div>
{% endblock %}
